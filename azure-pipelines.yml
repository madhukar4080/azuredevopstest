trigger:
  branches:
    include:
      - main
      - release/*

pool:
  name: Default   # Windows agent

variables:
- group: Dev-Variable-Group
- group: QA-Variable-Group
- name: nodeVersion
  value: '18.x'

stages:

# ================= DEV STAGE =================
- stage: Dev
  displayName: Deploy to DEV
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
  variables:
  - group: Dev-Variable-Group

  jobs:
  - job: BuildAndDeployDev
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)

    - script: |
        npm install
        npm run build
      displayName: Build React App (DEV)
      env:
        REACT_APP_ENV: $(REACT_APP_ENV)

    - task: AzureWebApp@1
      displayName: Deploy to Dev WebApp
      inputs:
        azureSubscription: $(azureSubscription)
        appName: $(WEBAPP_NAME)
        package: build


# ================= QA STAGE =================
- stage: QA
  displayName: Deploy to QA
  condition: startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')
  variables:
  - group: QA-Variable-Group

  jobs:
  - job: BuildAndDeployQA
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)

    - script: |
        npm install
        npm run build
      displayName: Build React App (QA)
      env:
        REACT_APP_ENV: $(REACT_APP_ENV)

    - task: AzureWebApp@1
      displayName: Deploy to QA WebApp
      inputs:
        azureSubscription: $(azureSubscription)
        appName: $(WEBAPP_NAME)
        package: build
