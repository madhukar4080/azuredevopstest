trigger:
  branches:
    include:
      - main
      - release/*

pool:
  name: Default

variables:
- group: Dev-Variable-Group
- group: QA-Variable-Group
#  azureSubscription: 'Azure subscription 1(1c29d824-9aa5-4286-9b2e-161e891c333f)'
- name: nodeVersion
  value: '18.x'

stages:

# ---------------- DEV STAGE ----------------
- stage: Dev
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
  variables:
  - group: Dev-Variable-Group
  jobs:
  - job: BuildAndDeployDev
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)

    - script: |
        npm install
        npm run build
      displayName: Build React App
      env:
        REACT_APP_ENV: $(REACT_APP_ENV)

    - task: AzureWebApp@1
      displayName: Deploy to Dev WebApp
      inputs:
        azureSubscription: '$(azureSubscription)'
        appName: $(WEBAPP_NAME)
        package: '$(System.DefaultWorkingDirectory)/dist'

# ---------------- QA STAGE ----------------
- stage: QA
  condition: startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')
  variables:
  - group: QA-Variable-Group
  jobs:
  - job: BuildAndDeployQA
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)

    - script: |
        npm install
        npm run build
      displayName: Build React App
      env:
        REACT_APP_ENV: $(REACT_APP_ENV)

    - task: AzureWebApp@1
      displayName: Deploy to QA WebApp
      inputs:
        azureSubscription: '$(azureSubscription)'
        appName: $(WEBAPP_NAME)
        package: '$(System.DefaultWorkingDirectory)/dist'