trigger:
  branches:
    include:
      - main
      - release/*

pool:
  name: Default   # Windows agent

variables:
- name: nodeVersion
  value: '18.x'

stages:

# ================= DEV =================
- stage: Dev
  displayName: Deploy DEV
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
  variables:
  - group: Dev-Variable-Group

  jobs:
  - job: DevDeploy
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)

    - script: |
        npm install
        npm run build
        dir
        dir dist
      displayName: Build React App (DEV)
      env:
        REACT_APP_ENV: $(REACT_APP_ENV)

    - task: AzureWebApp@1
      displayName: Deploy to Dev Web App
      inputs:
        azureSubscription: $(azureSubscription)
        appType: webAppLinux
        appName: $(WEBAPP_NAME)
        package: '$(System.DefaultWorkingDirectory)/dist'


# ================= QA =================
- stage: QA
  displayName: Deploy QA
  condition: startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')
  variables:
  - group: QA-Variable-Group

  jobs:
  - job: QADeploy
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)

    - script: |
        npm install
        npm run build
        dir
        dir dist
      displayName: Build React App (QA)
      env:
        REACT_APP_ENV: $(REACT_APP_ENV)

    - task: AzureWebApp@1
      displayName: Deploy to QA Web App
      inputs:
        azureSubscription: $(azureSubscription)
        appType: webAppLinux
        appName: $(WEBAPP_NAME)
        package: '$(System.DefaultWorkingDirectory)/dist'
